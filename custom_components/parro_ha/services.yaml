send_message:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: parro_ha
    conversation_id:
      required: true
      example: "123456"
      selector:
        text:
    message:
      required: true
      example: "Thank you, see you tomorrow."
      selector:
        text:
          multiline: true
get_announcements:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: parro_ha
    count:
      example: 1
      selector:
        number:
          min: 1
          max: 20
          mode: box
get_conversations:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: parro_ha
